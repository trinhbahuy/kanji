<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#f5f4ed" />
        <title>Kotoba · Mỗi ngày một chút Kanji</title>
        <link rel="stylesheet" href="./assets/css/style.css" />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
        ></script>
        <script defer src="./assets/js/config.js"></script>
        <script defer src="./assets/js/practice.js"></script>
        <script defer src="./assets/js/app.js"></script>
    </head>
    <body>
        <header>
            <a class="brand" href="./"
                ><span class="mark">こ</span> kotoba<span class="brand-dot"
                    >.</span
                ></a
            >
        </header>
        <main>
            <section id="study-panel">
                <div class="session-bar">
                    <span><i></i> GÓC LUYỆN TẬP</span
                    ><span>Minna 1 + Minna 2</span>
                </div>
                <div class="book-filter">
                    <label for="type-filter">Bộ từ</label>
                    <select id="type-filter" name="type">
                        <option value="minna 1">Minna 1</option>
                        <option value="minna 2">Minna 2</option>
                    </select>
                </div>
                <div id="round" class="card" aria-live="polite">
                    <div class="empty">
                        <span class="empty-kanji">学</span>
                        <h2>Sẵn sàng học một từ mới?</h2>
                        <p class="muted">Bấm “Từ ngẫu nhiên” để bắt đầu.</p>
                    </div>
                </div>
                <button
                    id="random"
                    type="button"
                    class="primary random"
                    hx-include="#type-filter"
                    hx-swap="none"
                    hx-sync="#study-panel:drop"
                    hx-disabled-elt="#study-panel button, #study-panel select"
                >
                    <span>⤨ &nbsp; Từ ngẫu nhiên</span><span>→</span>
                </button>
                <p id="network-message" role="status" class="message"></p>
                <p class="hint">Không cần vội. Thử nhớ trước khi xem cách đọc.</p>
            </section>
            <aside class="how">
                <span>01 <b>Nhìn Kanji</b></span
                ><span>02 <b>Nhập Hiragana</b></span
                ><span>03 <b>Ghi nhớ</b></span>
            </aside>
        </main>
        <footer>
            <span>Web tự học Kanji free</span>
        </footer>
    </body>
</html>
